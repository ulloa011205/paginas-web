<!--Crea una página con un <form> que solicite: nombre (<input type='text'>),
correo (<input type='email'>), fecha de nacimiento (<input type='date'>), 
y contraseña (<input type='password'>).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inscripcion</title>
</head>

<body>

    <Form>
        <fieldset>
            <legend>Inscripcion</legend>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9PGqCAwbiMKWnY0xwaE2IceR40howcSfE0g&s" alt=""><br><br>

            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre"><br><br>

            <label for="Correo">Correo Electronico:</label><br>
            <input type="email" id="correo" name="correo" placeholder="correo"><br><br>

            <label for="contraseña">Contraseña:</label><br>
            <input type="password" id="contraseña" name="contraseña" placeholder="Contraseña"><br><br>

            <input type="submit" value="Enviar"><br><br>
        

        </fieldset>
    </Form>
    
</body>
</html>
